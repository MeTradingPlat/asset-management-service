name: CD Historical Data Service

on:
  workflow_run:
    workflows: ["CI Historical Data Service"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Acquire exclusive deploy lock (avoid overwhelming the shared host)
        run: |
          LOCK_DIR="/tmp/metradingplat-deploy.lock"
          MAX_WAIT=2400
          MAX_LOCK_AGE=1800
          waited=0
          while ! mkdir "$LOCK_DIR" 2>/dev/null; do
            lock_age=$(( $(date +%s) - $(stat -c %Y "$LOCK_DIR" 2>/dev/null || date +%s) ))
            if [ "$lock_age" -gt "$MAX_LOCK_AGE" ]; then
              echo "Lock abandonado hace ${lock_age}s (el dueno probablemente murio) -- liberando y tomando control"
              rm -rf "$LOCK_DIR"
              continue
            fi
            if [ "$waited" -ge "$MAX_WAIT" ]; then
              echo "Timeout esperando el lock de deploy compartido"
              exit 1
            fi
            echo "Otro deploy de MeTradingPlat esta en curso, esperando... (${waited}s/${MAX_WAIT}s)"
            sleep 10
            waited=$((waited + 10))
          done
          echo "${{ github.repository }}" > "$LOCK_DIR/owner"
          echo "Lock de deploy adquirido"

      - name: Create Docker Network
        run: |
          docker network create metradingplat-network || echo "Network already exists"

      - name: Create Postgres Container (not started -- see historical-data-service pause below)
        run: |
          if [ -z "$(docker ps -a -q -f name=postgres-historical)" ]; then
            echo "Creating postgres-historical container (left stopped on purpose)..."
            # candles ya pasa los 20M de filas y crece rapido -- shared_buffers/
            # maintenance_work_mem por defecto (128MB/64MB) son los valores de
            # fabrica de Postgres, pensados para instalaciones chicas, sin
            # relacion con cuanta RAM le de el contenedor. maintenance_work_mem
            # en particular es lo que le da presupuesto de memoria a VACUUM --
            # con 64MB, un vacuum sobre esta tabla se estiraba 30+ minutos
            # compitiendo por I/O con las escrituras en vivo (confirmado en
            # produccion). El servidor tiene 12GB RAM / 1TB disco disponibles.
            #
            # restart=no y "docker create" (no "run -d"): historical-data-service
            # y esta base saturaban el disco compartido del host durante el
            # backfill (confirmado en vivo 2026-08-03) -- se dejan creadas pero
            # apagadas hasta que alguien las arranque a mano quando sea seguro.
            docker create \
              --name "postgres-historical" \
              --network "metradingplat-network" \
              --restart "no" \
              --memory "2g" \
              --memory-swap "2g" \
              -e POSTGRES_DB="bd_historical" \
              -e POSTGRES_USER="user_historical" \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -v postgres_historical_data:/var/lib/postgresql/data \
              postgres:15-alpine \
              -c shared_buffers=1GB \
              -c effective_cache_size=1536MB \
              -c work_mem=32MB \
              -c maintenance_work_mem=512MB
          else
            echo "postgres-historical container already exists -- leaving its current state alone (NOT auto-starting it)."
          fi

      - name: Infrastructure Diagnosis & Cleanup
        run: |
          echo "--- DISK SPACE CHECK ---"
          df -h
          echo "--- CLEANING SERVICE METADATA ---"
          docker rm -f historical-data-service || true
          docker image rm -f virtud142/metradingplat_historical_data_service:latest || true

      - name: Pull Application Image (with Retry Logic)
        run: |
          for i in 1 2 3 4 5; do
            docker pull virtud142/metradingplat_historical_data_service:latest && exit 0 || \
            (echo "Attempt $i failed, waiting $((i * 15))s..." && sleep $((i * 15)))
          done
          echo "All pull attempts failed. Docker daemon might need a manual restart."
          exit 1

      - name: Create Application Container (deliberately NOT started)
        run: |
          # historical-data-service's backfill saturated the shared host's disk
          # for hours (confirmed in production 2026-08-03) and this workflow's
          # own "always/unless-stopped" restart policies kept resurrecting it
          # under people's feet mid-incident. "docker create" (not "run -d")
          # deploys the new image and leaves the container sitting stopped --
          # someone has to explicitly `docker start historical-data-service`
          # once it's safe to run. --restart no so it never self-resurrects.
          docker create \
            --name "historical-data-service" \
            --network "metradingplat-network" \
            --restart "no" \
            --memory "512m" \
            --memory-swap "512m" \
            --label project="metradingplat" \
            --label service="historical-data-service" \
            -e HD_DB_HOST="postgres-historical" \
            -e HD_DB_PORT="5432" \
            -e HD_DB_NAME="bd_historical" \
            -e HD_DB_USER="user_historical" \
            -e HD_DB_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            -e HD_ALPACA_API_KEY="${{ secrets.ALPACA_API_KEY }}" \
            -e HD_ALPACA_API_SECRET="${{ secrets.ALPACA_API_SECRET }}" \
            -e HD_MARKETDATA_URL="http://marketdata-service:8082" \
            -e HD_LOG_LEVEL="INFO" \
            virtud142/metradingplat_historical_data_service:latest

      - name: Clean Old Images of This Service
        run: |
          docker images virtud142/metradingplat_historical_data_service --format "{{.ID}} {{.Tag}}" \
            | grep -v "latest" | awk '{print $1}' | xargs -r docker rmi -f 2>/dev/null || true

      - name: Clean Stopped Containers of This Service
        run: |
          docker ps -a \
            --filter "label=service=historical-data-service" \
            --filter "status=exited" -q | xargs -r docker rm 2>/dev/null || true

      - name: Final Status Check
        run: |
          echo "historical-data-service and postgres-historical are created but deliberately NOT started -- run 'docker start postgres-historical historical-data-service' manually when it's safe to."
          docker ps -a --filter "name=historical-data-service" --filter "name=postgres-historical" --format '{{.Names}}: {{.Status}}'

      - name: Release exclusive deploy lock
        if: always()
        run: |
          LOCK_DIR="/tmp/metradingplat-deploy.lock"
          if [ -f "$LOCK_DIR/owner" ] && [ "$(cat "$LOCK_DIR/owner")" = "${{ github.repository }}" ]; then
            rm -rf "$LOCK_DIR"
          fi
