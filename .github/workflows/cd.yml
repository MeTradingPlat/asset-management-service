name: CD Historical Data Service

on:
  workflow_run:
    workflows: ["CI Historical Data Service"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Create Docker Network
        run: |
          docker network create metradingplat-network || echo "Network already exists"

      - name: Run Postgres Container
        run: |
          if [ -z "$(docker ps -a -q -f name=postgres-historical)" ]; then
            echo "Creating and starting postgres-historical container..."
            docker run -d \
              --name "postgres-historical" \
              --network "metradingplat-network" \
              --restart "always" \
              --memory "768m" \
              --memory-swap "768m" \
              -e POSTGRES_DB="bd_historical" \
              -e POSTGRES_USER="user_historical" \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -v postgres_historical_data:/var/lib/postgresql/data \
              postgres:15-alpine
          else
            echo "postgres-historical container exists, ensuring it is started..."
            docker start postgres-historical
          fi

      - name: Infrastructure Diagnosis & Cleanup
        run: |
          echo "--- DISK SPACE CHECK ---"
          df -h
          echo "--- CLEANING SERVICE METADATA ---"
          docker rm -f historical-data-service || true
          docker image rm -f virtud142/metradingplat_historical_data_service:latest || true

      - name: Pull Application Image (with Retry Logic)
        run: |
          for i in 1 2 3; do
            docker pull virtud142/metradingplat_historical_data_service:latest && exit 0 || \
            (echo "Attempt $i failed, waiting 10s..." && sleep 10)
          done
          echo "All pull attempts failed. Docker daemon might need a manual restart."
          exit 1

      - name: Run Application Container
        run: |
          docker run -d \
            --name "historical-data-service" \
            --network "metradingplat-network" \
            --restart "unless-stopped" \
            --memory "512m" \
            --memory-swap "512m" \
            --label project="metradingplat" \
            --label service="historical-data-service" \
            -e HD_DB_HOST="postgres-historical" \
            -e HD_DB_PORT="5432" \
            -e HD_DB_NAME="bd_historical" \
            -e HD_DB_USER="user_historical" \
            -e HD_DB_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            -e HD_ALPACA_API_KEY="${{ secrets.HD_ALPACA_API_KEY }}" \
            -e HD_ALPACA_API_SECRET="${{ secrets.HD_ALPACA_API_SECRET }}" \
            -e HD_MARKETDATA_URL="http://marketdata-service:8082" \
            -e HD_LOG_LEVEL="INFO" \
            virtud142/metradingplat_historical_data_service:latest

      - name: Clean Old Images of This Service
        run: |
          docker images virtud142/metradingplat_historical_data_service --format "{{.ID}} {{.Tag}}" \
            | grep -v "latest" | awk '{print $1}' | xargs -r docker rmi -f 2>/dev/null || true

      - name: Clean Stopped Containers of This Service
        run: |
          docker ps -a \
            --filter "label=service=historical-data-service" \
            --filter "status=exited" -q | xargs -r docker rm 2>/dev/null || true

      - name: Final Status Check
        run: |
          sleep 5
          docker ps | grep historical-data-service
          echo "--- LAST 20 LINES OF LOGS ---"
          docker logs --tail 20 historical-data-service
